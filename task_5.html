<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Основы механики</title>
  <style>
    :root {
      --c1: #2563eb;
      --c2: #1d4ed8;
      --c3: #3b82f6;
      --accent: #2563eb;
      --correct: #1a9e6a;
      --correct-bg: #edfaf4;
      --wrong: #c0392b;
      --wrong-bg: #fff1f1;
    }


    
    * { box-sizing: border-box; margin: 0; padding: 0; }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideInRight {
      from { opacity: 0; transform: translateX(60px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes slideInLeft {
      from { opacity: 0; transform: translateX(-60px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    @keyframes popIn {
      0%   { transform: scale(0.85); opacity: 0; }
      70%  { transform: scale(1.04); }
      100% { transform: scale(1);    opacity: 1; }
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%     { transform: translateX(-8px); }
      40%     { transform: translateX(8px); }
      60%     { transform: translateX(-5px); }
      80%     { transform: translateX(5px); }
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 0 0 rgba(37,99,235,0.3); }
      50%     { box-shadow: 0 0 0 12px transparent; }
    }
    @keyframes barGrow {
      from { width: 0%; }
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
    @keyframes starPop {
      0%   { transform: scale(0) rotate(-20deg); opacity: 0; }
      60%  { transform: scale(1.2) rotate(5deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 50%, #3b82f6 100%);
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 16px 60px;
    }

    .page-header {
      text-align: center;
      margin-bottom: 32px;
      animation: fadeInUp 0.7s ease both;
    }
    .page-header .badge {
      display: inline-block;
      background: rgba(255,255,255,0.18);
      color: white;
      border-radius: 999px;
      padding: 8px 20px;
      font-size: 15px;
      margin-bottom: 12px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,0.25);
    }
    .page-header h1 {
      color: white;
      font-size: 38px;
      text-shadow: 0 2px 12px rgba(0,0,0,0.18);
      margin-bottom: 6px;
    }
    .page-header p {
      color: rgba(255,255,255,0.85);
      font-size: 16px;
    }

    .card {
      background: white;
      border-radius: 28px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      overflow: hidden;
      max-width: 640px;
      width: 100%;
      animation: popIn 0.6s cubic-bezier(.34,1.56,.64,1) both;
    }

    .card-header {
      background: linear-gradient(135deg, var(--c1) 0%, var(--c2) 60%, var(--c3) 100%);
      padding: 28px 30px 22px;
      position: relative;
      overflow: hidden;
    }
    .card-header::before {
      content: '';
      position: absolute;
      width: 220px; height: 220px;
      border-radius: 50%;
      background: rgba(255,255,255,0.07);
      top: -60px; right: -60px;
    }
    .card-header::after {
      content: '';
      position: absolute;
      width: 150px; height: 150px;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      bottom: -50px; left: 30px;
    }

    .header-badge {
      display: inline-block;
      background: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.95);
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 14px;
      margin-bottom: 14px;
      border: 1px solid rgba(255,255,255,0.2);
    }
    .card-title {
      color: white;
      font-size: 26px;
      margin-bottom: 6px;
      position: relative;
    }
    .card-meta {
      color: rgba(255,255,255,0.88);
      font-size: 14px;
      margin-bottom: 18px;
      position: relative;
    }
    .progress-wrap {
      background: rgba(255,255,255,0.22);
      border-radius: 999px;
      height: 10px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar {
      height: 100%;
      border-radius: 999px;
      background: linear-gradient(90deg, rgba(255,255,255,0.9), white);
      transition: width 0.4s cubic-bezier(.4,0,.2,1);
      animation: barGrow 0.5s ease;
    }

    .card-body {
      padding: 28px 30px;
    }

    .q-counter {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 10px;
    }
    .q-text {
      font-size: 22px;
      color: #1a2433;
      line-height: 1.4;
      margin-bottom: 22px;
      min-height: 60px;
    }
    .q-text.anim-right { animation: slideInRight 0.35s ease both; }
    .q-text.anim-left  { animation: slideInLeft  0.35s ease both; }

    .options {
      display: grid;
      gap: 12px;
      margin-bottom: 16px;
    }
    .opt {
      width: 100%;
      background: #f8f9fb;
      border: 2px solid #e4e9f0;
      border-radius: 16px;
      padding: 15px 18px;
      text-align: left;
      font-size: 17px;
      color: #2d3748;
      cursor: pointer;
      transition: all 0.18s ease;
      position: relative;
      overflow: hidden;
    }
    .opt::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--c1), var(--c3));
      opacity: 0;
      transition: opacity 0.2s;
    }
    .opt span { position: relative; z-index: 1; }
    .opt:hover:not(:disabled) {
      border-color: var(--accent);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(0,0,0,0.07);
    }
    .opt:hover:not(:disabled)::before { opacity: 0.06; }
    .opt:active:not(:disabled) { transform: scale(0.98); }

    .opt.correct {
      border-color: var(--correct);
      background: var(--correct-bg);
      color: var(--correct);
      font-weight: 700;
      animation: pulse 0.6s ease;
    }
    .opt.wrong {
      border-color: var(--wrong);
      background: var(--wrong-bg);
      color: var(--wrong);
      font-weight: 700;
      animation: shake 0.4s ease;
    }
    .opt:disabled { cursor: default; }

    .explanation {
      display: none;
      background: #eef8fd;
      border-left: 5px solid var(--accent);
      border-radius: 14px;
      padding: 14px 18px;
      font-size: 15px;
      color: #2c4a5a;
      line-height: 1.5;
      margin-bottom: 16px;
      animation: fadeInUp 0.3s ease;
    }
    .explanation.show { display: block; }

    .card-footer {
      display: flex;
      gap: 10px;
      justify-content: space-between;
    }
    .btn {
      border: none;
      border-radius: 14px;
      padding: 14px 22px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.18s ease;
    }
    .btn:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(0.95); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .btn-back {
      background: #f0f2f5;
      color: #4a5568;
    }
    .btn-next {
      background: linear-gradient(135deg, var(--c1), var(--c2));
      color: white;
      flex: 1;
      box-shadow: 0 6px 20px rgba(37,99,235,0.35);
    }

    /* Result */
    .result {
      display: none;
      text-align: center;
      padding: 10px 0 0;
      animation: fadeInUp 0.5s ease;
    }
    .result.show { display: block; }
    .stars {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .star {
      font-size: 34px;
      opacity: 0;
      animation: starPop 0.4s ease forwards;
    }
    .result-score {
      font-size: 56px;
      font-weight: 900;
      background: linear-gradient(135deg, var(--c1), var(--c2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 6px;
    }
    .result-msg {
      font-size: 18px;
      color: #4a5568;
      margin-bottom: 20px;
    }
    .btn-restart {
      border: none;
      background: linear-gradient(135deg, var(--c1), var(--c2));
      color: white;
      font-size: 16px;
      font-weight: 700;
      padding: 14px 30px;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(37,99,235,0.35);
      transition: 0.2s;
    }
    .btn-restart:hover { transform: translateY(-2px); filter: brightness(0.95); }

    /* Confetti */
    .confetti-piece {
      position: fixed;
      width: 10px; height: 14px;
      border-radius: 3px;
      top: -20px;
      animation: confettiFall linear forwards;
      pointer-events: none;
    }

    @media(max-width:480px) {
      .page-header h1 { font-size: 28px; }
      .card-body { padding: 20px; }
      .q-text { font-size: 19px; }
      .opt { font-size: 15px; }
    }
  </style>
</head>
<body>
  <div class="page-header">
    <div class="badge">📐 Физика — 7 класс</div>
    <h1>Основы механики</h1>
    <p>7 класс • Физика • Базовый уровень</p>
  </div>

  <div class="card" id="card">
    <div class="card-header">
      <div class="header-badge">⚙️ Викторина • 5 вопросов</div>
      <h2 class="card-title">Механика и движение</h2>
      <p class="card-meta" id="meta">Задание 1 из 4 • Выбери правильный ответ</p>
      <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
      </div>
    </div>
    <div class="card-body">
      <div class="q-counter" id="counter"></div>
      <div class="q-text" id="qText"></div>
      <div class="options" id="options"></div>
      <div class="explanation" id="explanation"></div>
      <div class="result" id="result">
        <div class="stars" id="stars"></div>
        <div class="result-score" id="scoreVal"></div>
        <div class="result-msg" id="scoreMsg"></div>
        <button class="btn-restart" onclick="restart()">🔄 Пройти заново</button>
      </div>
      <div class="card-footer" id="footer">
        <button class="btn btn-back" id="btnBack" onclick="prev()">← Назад</button>
        <button class="btn btn-next" id="btnNext" onclick="next()" disabled>Следующий вопрос →</button>
      </div>
    </div>
  </div>

  <script>
    const questions = [{"question": "Что такое инерция?", "options": ["Способность тела сохранять скорость", "Сила притяжения к Земле", "Нагревание тела при движении", "Изменение направления движения"], "correct": 0, "explanation": "Инерция — свойство тела сохранять состояние покоя или равномерного прямолинейного движения при отсутствии внешних сил."}, {"question": "В каких единицах измеряется сила?", "options": ["Паскаль", "Ватт", "Ньютон", "Джоуль"], "correct": 2, "explanation": "Сила измеряется в ньютонах (Н). 1 Н = 1 кг·м/с²."}, {"question": "Скорость — это...", "options": ["Расстояние между двумя точками", "Путь, пройденный за единицу времени", "Время движения тела", "Масса делённая на объём"], "correct": 1, "explanation": "Скорость — это физическая величина, равная пути, пройденному телом за единицу времени."}, {"question": "Плотность вещества вычисляется как...", "options": ["масса × объём", "объём ÷ масса", "масса ÷ объём", "сила ÷ площадь"], "correct": 2, "explanation": "Плотность: ρ = m/V, где m — масса, V — объём тела."}, {"question": "Как называется прибор для измерения силы?", "options": ["Термометр", "Динамометр", "Амперметр", "Вольтметр"], "correct": 1, "explanation": "Силу измеряют динамометром, принцип которого основан на деформации пружины."}];

    let current = 0;
    let answered = Array(questions.length).fill(null);
    let locked   = Array(questions.length).fill(false);
    let dir = 'right';

    const TOTAL = questions.length;
    const letters = ['А','Б','В','Г','Д'];

    function render() {
      const q = questions[current];
      const isLocked = locked[current];
      const sel = answered[current];

      document.getElementById('counter').textContent = `ВОПРОС ${current+1} ИЗ ${TOTAL}`;

      const qEl = document.getElementById('qText');
      qEl.className = 'q-text anim-' + dir;
      void qEl.offsetWidth;
      qEl.textContent = q.question;

      document.getElementById('progressBar').style.width = (((current+1)/TOTAL)*100)+'%';

      const optEl = document.getElementById('options');
      optEl.innerHTML = q.options.map((o,i) => {
        let cls = 'opt';
        if(isLocked) {
          if(i===q.correct) cls+=' correct';
          else if(i===sel && i!==q.correct) cls+=' wrong';
        }
        return `<button class="${cls}" ${isLocked?'disabled':''} onclick="pick(${i})">
          <span>${letters[i]}) ${o}</span></button>`;
      }).join('');

      const expEl = document.getElementById('explanation');
      expEl.textContent = '💡 '+q.explanation;
      expEl.className = 'explanation' + (isLocked?' show':'');

      const resultEl = document.getElementById('result');
      const footerEl = document.getElementById('footer');
      const btnNext  = document.getElementById('btnNext');
      const btnBack  = document.getElementById('btnBack');

      const allDone = locked.every(v=>v);

      if(allDone && current===TOTAL-1) {
        resultEl.classList.add('show');
        footerEl.style.display = 'none';
        showScore();
      } else {
        resultEl.classList.remove('show');
        footerEl.style.display = '';
        btnBack.disabled = current===0;
        btnNext.disabled = !isLocked;
        btnNext.textContent = current===TOTAL-1 ? 'Показать результат →' : 'Следующий вопрос →';
      }
    }

    function pick(i) {
      if(locked[current]) return;
      answered[current] = i;
      locked[current] = true;
      render();
    }

    function next() {
      if(current<TOTAL-1) { dir='right'; current++; render(); }
      else { dir='right'; render(); }
    }
    function prev() {
      if(current>0) { dir='left'; current--; render(); }
    }

    function showScore() {
      const score = questions.reduce((s,q,i)=>s+(answered[i]===q.correct?1:0),0);
      document.getElementById('scoreVal').textContent = score+' / '+TOTAL;
      const stars = score===TOTAL?3:score>=3?2:1;
      document.getElementById('stars').innerHTML =
        Array.from({length:3},(_,i)=>`<span class="star" style="animation-delay:${i*0.15}s">${i<stars?'⭐':'☆'}</span>`).join('');
      const msgs = ['Стоит повторить тему!','Хороший результат!','Неплохо, но можно лучше!','Очень хорошо!','Отлично! Все верно! 🎉'];
      document.getElementById('scoreMsg').textContent = msgs[Math.min(score,4)];
      if(score===TOTAL) launchConfetti();
    }

    function launchConfetti() {
      const colors = ['#2563eb','#1d4ed8','#ffcc00','#ff6b6b','#48dbfb','#ff9ff3'];
      for(let i=0;i<60;i++) {
        const el = document.createElement('div');
        el.className='confetti-piece';
        el.style.cssText = `left:${Math.random()*100}vw;background:${colors[i%colors.length]};
          width:${6+Math.random()*10}px;height:${10+Math.random()*8}px;
          animation-duration:${2+Math.random()*2}s;animation-delay:${Math.random()*0.8}s;
          border-radius:${Math.random()>0.5?'50%':'3px'};opacity:0.9`;
        document.body.appendChild(el);
        el.addEventListener('animationend',()=>el.remove());
      }
    }

    function restart() {
      current=0;
      answered=Array(TOTAL).fill(null);
      locked=Array(TOTAL).fill(false);
      dir='right';
      document.getElementById('result').classList.remove('show');
      document.getElementById('footer').style.display='';
      render();
    }

    render();
  </script>
</body>
</html>
